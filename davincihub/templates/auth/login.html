{% extends "base.html" %}

{% block titulo %}Ingresar — Da Vinci Hub{% endblock %}

{% block contenido %}
<section class="formulario-pagina">
  <div class="tarjeta-acceso">
  <img class="acceso-ilustracion" src="{{ url_for('static', filename='img/acceso.png') }}" alt="">
  <form class="formulario" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Ingresar</h1>
    {% if error %}<p class="error-texto">{{ error }}</p>{% endif %}
    <div class="campo">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ request.form.get('email', '') }}" required>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required>
    </div>
    <button class="boton boton-primario" type="submit">Ingresar</button>
    <p class="nota">¿No tenés cuenta? <a href="{{ url_for('auth.registro') }}">Creala acá</a>.</p>
  </form>
  </div>
</section>
{% endblock %}

{% extends "base.html" %}

{% block titulo %}Ingresar — Da Vinci Hub{% endblock %}

{% block contenido %}
<section class="formulario-pagina">
  <div class="tarjeta-acceso">
  <img class="acceso-ilustracion" src="{{ url_for('static', filename='img/acceso.png') }}" alt="">
  <form class="formulario" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Ingresar</h1>
    {% if error %}<p class="error-texto">{{ error }}</p>{% endif %}
    <div class="campo">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ request.form.get('email', '') }}" required>
    </div>
    <!-- <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required>
    </div> -->
    <div class="campo">
  <label for="password">Contraseña</label>
  <div class="password-contenedor">
    <input id="password" name="password" type="password" required>
    <button
      class="password-ojo"
      type="button"
      aria-label="Mostrar contraseña"
      aria-pressed="false"
      data-password-toggle="password"
    >
      <svg xmlns="http://www.w3.org/2000/svg"
           width="21"
           height="21"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.8"
           stroke-linecap="round"
           stroke-linejoin="round"
           aria-hidden="true">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
</div>
    <button class="boton boton-primario" type="submit">Ingresar</button>
    <p class="nota">¿No tenés cuenta? <a href="{{ url_for('auth.registro') }}">Creala acá</a>.</p>
  </form>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='login.js') }}" defer></script>
{% endblock %}

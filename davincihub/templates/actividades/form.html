{% extends "base.html" %}

{% block titulo %}{{ "Editar" if actividad else "Proponer" }} actividad — Da Vinci Hub{% endblock %}

{% block contenido %}
<section class="contenedor pagina-modulo">
  <div class="cabecera-modulo">
    <div>
      <a class="enlace-volver" href="{{ url_for('actividades.lista') }}">← Actividades</a>
      <h1>{{ "Editar actividad" if actividad else "Proponer actividad" }}</h1>
    </div>
  </div>

  {% if error %}
    <p class="aviso aviso-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" class="formulario tarjeta formulario-actividad">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="campo">
      <label for="nombre">Nombre de la actividad</label>
      <input type="text" id="nombre" name="nombre"
             value="{{ (actividad or {}).get('nombre', '') }}"
             required maxlength="120" placeholder="Ej: Workshop de Ilustración Digital">
    </div>

    <div class="campo">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" rows="4"
                required placeholder="Contá de qué se trata la actividad…">{{ (actividad or {}).get('descripcion', '') }}</textarea>
    </div>

    <div class="campo-doble campos-fila">
      <div class="campo">
        <label for="inicio">Fecha y hora de inicio</label>
        <input type="datetime-local" id="inicio" name="inicio"
               value="{{ (actividad or {}).get('inicio', '')[:16] }}" required>
      </div>
      <div class="campo">
        <label for="fin">Fecha y hora de fin <span class="opcional">(opcional)</span></label>
        <input type="datetime-local" id="fin" name="fin"
               value="{{ (actividad or {}).get('fin', '')[:16] if (actividad or {}).get('fin') else '' }}">
      </div>
    </div>

    <div class="campo-doble campos-fila campos-fila-ubicacion">
      <div class="campo">
        <label for="ubicacion">Ubicación</label>
        <input type="text" id="ubicacion" name="ubicacion"
               value="{{ (actividad or {}).get('ubicacion', '') }}"
               required maxlength="200" placeholder="Ej: Auditorio, Aula 3, Online…">
      </div>
      <div class="campo">
        <label for="cupo_maximo">Cupo máximo</label>
        <input type="number" id="cupo_maximo" name="cupo_maximo"
               value="{{ (actividad or {}).get('cupo_maximo', '') }}"
               required min="1" max="500" placeholder="Ej: 30">
      </div>
    </div>

    <div class="formulario-acciones">
      <button class="boton boton-primario" type="submit" id="btn-enviar">
        {{ "Guardar cambios" if actividad else "Enviar propuesta" }}
      </button>
      <a class="boton boton-suave" href="{{ url_for('actividades.lista') }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}

[project]
name = "davincihub"
version = "0.1.0"
description = "Plataforma de comunidad y servicios para estudiantes de Da Vinci"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-wtf>=1.2",
    "gunicorn>=21",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["davincihub*"]

[tool.setuptools.package-data]
davincihub = ["templates/**/*.html", "static/**/*", "*.sql"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

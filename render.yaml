services:
  - type: web
    name: davincihub
    runtime: python
    plan: free
    branch: dev
    buildCommand: pip install .
    startCommand: gunicorn 'davincihub.app:create_app()'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: davincihub-db
          property: connectionString

databases:
  - name: davincihub-db
    plan: free
